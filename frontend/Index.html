<!DOCTYPE html>
<html lang="en">
<head>

    <title>ImmXrsive Phase 0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>ImmXrsive Phase 0</h1>

        <p>Production Pipeline Demo</p>

        <div class="status-box">

        </div>
    </div>

    <script src="config.js"></script>
